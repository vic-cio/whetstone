<!-- A mini-app that reports the service channel rather than using it. This course is
     never shipped: it exists so a test can read what crossed, in the real runtime. -->
<div id="app"></div>

<script>
  var START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1'
  var report = {}

  function say(key) {
    return function (answer) {
      report[key] = answer
    }
  }

  function refused(key) {
    return function (error) {
      report[key] = 'refused ' + error.message
    }
  }

  Kit.ask('chess', { op: 'moves', fen: START, from: 'e2' })
    .then(function (answer) {
      report.moves = answer.moves
        .map(function (move) {
          return move.san
        })
        .join(' ')
    }, refused('moves'))
    .then(function () {
      return Kit.ask('chess', { op: 'best', fen: START, depth: 1 }).then(function (answer) {
        report.best = answer.move.san
      }, refused('best'))
    })
    .then(function () {
      // A service this build does not have, declared or not.
      return Kit.ask('shell', { op: 'run' }).then(say('unknown'), refused('unknown'))
    })
    .then(function () {
      document.getElementById('app').textContent = 'Service probe'
      Kit.bridge.answer(report)
    })

  Kit.bridge.ready()
</script>
