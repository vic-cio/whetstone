<!-- A demonstration. It answers nothing: a Lesson records nothing, so an `app` block is
     something to play with and a `try` block is where a Lesson asks a question. -->
<div id="app"></div>
<script>
  var at = 0.4
  var f = function (x) { return Math.sin(3 * x * x) }
  var df = function (x) { return 6 * x * Math.cos(3 * x * x) }

  var view = Kit.plot({
    mount: '#app',
    domain: [-1.2, 1.2],
    range: [-1.6, 1.6],
    height: 230,
    label: 'The curve sin(3x squared) with the tangent line at the chosen point',
  })
  view.curve(f)
  view.curve(function (x) { return f(at) + df(at) * (x - at) })

  var x = Kit.slider({
    mount: '#app',
    label: 'x',
    min: -1.2,
    max: 1.2,
    step: 0.01,
    value: at,
  })

  x.onChange(function (value) {
    at = value
    view.mark(at, f(at))
    view.readout('slope ' + df(at).toFixed(3))
  })

  view.onPick(function (value) { x.set(value) })

  Kit.bridge.ready()
</script>
