appId: dev.whetstone.app
productName: Whetstone
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# The sample Course ships beside the app and is copied into a brand-new courses root on
# first run, so a fresh install opens with something to read rather than an empty library.
# It is one course, and it is about the app: somebody opening this for the first time has
# nothing of their own yet, and a course on somebody else's subject explains nothing.
extraResources:
  - from: fixtures/courses/using-whetstone
    to: samples/using-whetstone
  # The toolkit this build ships. It is written into a Course at build time and nowhere
  # else: the host always injects the copy pinned inside the Course folder.
  - from: toolkit
    to: toolkit
  # What the app hands a Harness: the registry, the role instruction files, and the plugin
  # bundles. The user never sees any of it; it is implementation, not a feature.
  - from: agent
    to: agent
mac:
  # The mark is a whetstone with an edge on it, in the app's own two colours. It is drawn in
  # `build/icon.png` and turned into `build/icon.icns`; electron-builder picks up the icns
  # from `buildResources` by name.
  icon: build/icon.icns
  target:
    - target: dir
      arch: [arm64]
    - target: dmg
      arch: [arm64]
    # A zip as well as a dmg, because `scripts/install.sh` unpacks one without mounting
    # anything. A dmg is for a person dragging an icon; a zip is for a script.
    - target: zip
      arch: [arm64]
  # A fixed name, with no version in it. `scripts/install.sh` fetches
  # `releases/latest/download/Whetstone-mac-arm64.zip`, and that URL can only resolve if
  # every release calls the file the same thing.
  artifactName: Whetstone-mac-${arch}.${ext}
  category: public.app-category.education
  # Unsigned on purpose: this is a personal build, not something being distributed.
  identity: null
  darkModeSupport: true
dmg:
  title: Whetstone
